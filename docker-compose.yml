version: '3.8'
services:
  db:
    image: postgres:16-alpine
    container_name: gstudio-postgres
    environment:
      POSTGRES_USER: lovable_user
      POSTGRES_PASSWORD: lovable_password
      POSTGRES_DB: open_lovable
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  web:
    build: .
    container_name: gstudio-web
    ports:
      - "9010:9010"
    environment:
      - PORT=9010
      - DOCKER_ENV=true
    env_file:
      - .env.local
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pgdata:
